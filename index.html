<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F7FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090E19" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Sahayak — government schemes in your language. Speak, check what you are entitled to, prepare your papers and track your application, without paying a middleman." />
    <meta property="og:title" content="Sahayak · Your welfare, in your language" />
    <meta property="og:description" content="Voice-first welfare discovery for every Indian household — 13 languages, free forever." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>Sahayak · Your welfare, in your language</title>

    <!-- Apply saved theme / text size / language before first paint (prevents flash) -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var p = JSON.parse(localStorage.getItem('sahayak_prefs') || '{}');
          var theme = p.theme || 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark && !p.sunlight) d.classList.add('dark');
          if (p.sunlight) d.classList.add('high-contrast');
          if (p.lite) d.classList.add('lite');
          if (p.textSize && p.textSize !== 'md') d.setAttribute('data-text', p.textSize);
          var lang = localStorage.getItem('sahayak_language');
          if (lang) { d.lang = lang; d.dir = lang === 'ur' ? 'rtl' : 'ltr'; }
        } catch (e) {}
      })();
    </script>

    <!-- Plus Jakarta Sans is always needed (numerals, brand, English). Script cuts are streamed per language by src/lib/fonts.ts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" />

    <style>
      /* Splash — shown until React mounts. Matches the Aangan canvas so there is no flash. */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #F6F7FA; z-index: 9; }
      html.dark #boot { background: #090E19; }
      #boot svg { width: 64px; height: 73px; animation: boot 1.4s cubic-bezier(.2,0,0,1) infinite; }
      @keyframes boot { 0%,100% { transform: scale(1); } 50% { transform: scale(.92); } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-label="Loading Sahayak" role="status">
        <svg viewBox="0 0 100 114" aria-hidden="true">
  <path d="M50.5 3.5C38 10.5 22 16 4.5 19 3.5 46 6.5 71 19.5 88.5M27.5 96.5C34.5 102.5 42 106.5 50.5 110.5 61 106 72 100 81 89 95 72 98 46 96.5 19 79 16 63 10.5 50.5 3.5" fill="none" stroke="#111E33" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

    <path d="M87.5 44.5C82 52 76 56.5 70.5 57.5 67 58 63.5 57.5 60.5 55.5 57.5 53 56 48.5 55.5 44 53.5 49 53 55 55 60.5 57 65.5 57.5 70 57 75 56.5 79.5 57 83.5 59 87.5L66.5 85.5C67 80 68 74 71 69 73.5 65 77 62.5 80 60 84 56.5 86.5 51 87.5 44.5Z"/>
  </g>
</svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

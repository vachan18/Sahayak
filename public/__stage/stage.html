<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sahayak — demo stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Kannada:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&family=Noto+Sans+Telugu:wght@500;700&family=Noto+Sans+Bengali:wght@500;700&family=Noto+Sans+Gurmukhi:wght@500;700&family=Noto+Sans+Gujarati:wght@500;700&family=Noto+Sans+Malayalam:wght@500;700&family=Noto+Sans+Oriya:wght@500;700&family=Noto+Nastaliq+Urdu:wght@500;700&display=block" />
<style>
  :root { --navy:#111E33; --navy2:#0A1322; --orange:#FC7C24; --teal:#1DAF8F; --paper:#F6F7FA; --ease:cubic-bezier(.2,0,0,1); }
  * { box-sizing:border-box; }
  html,body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--navy2); font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:#fff; -webkit-font-smoothing:antialiased; }
  #bg { position:absolute; inset:0; background:
      radial-gradient(1200px 700px at 78% 18%, rgba(29,175,143,.10), transparent 60%),
      radial-gradient(1000px 700px at 12% 92%, rgba(252,124,36,.10), transparent 60%),
      linear-gradient(180deg,#0C1628,#08101D); }
  #bg::after { content:''; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size:28px 28px; mask-image:radial-gradient(ellipse at center, #000 40%, transparent 80%); }

  /* ── Devices ─────────────────────────────────── */
  #rig { position:absolute; transition: transform 1.1s var(--ease), opacity .7s var(--ease), filter .7s var(--ease); will-change:transform; }
  #rig.dim { opacity:.0; transform: scale(.94); filter: blur(8px); }
  .desktop #rig { left:240px; top:30px; width:1440px; height:858px; transform-origin: 50% 50%; }
  .browser { width:1440px; height:858px; border-radius:16px; overflow:hidden; background:#fff; box-shadow: 0 40px 120px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08); }
  .bar { height:48px; background:#EDF0F5; display:flex; align-items:center; gap:10px; padding:0 18px; border-bottom:1px solid #dde2ea; }
  .dots span { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:7px; }
  .url { margin-left:24px; flex:0 0 560px; height:30px; border-radius:8px; background:#fff; color:#475467; font-size:14px; display:flex; align-items:center; gap:8px; padding:0 14px; }
  .url b { color:#111E33; font-weight:600; }
  .desktop iframe { width:1440px; height:810px; border:0; display:block; background:var(--paper); }

  .mobile #rig { left:1150px; top:58px; width:426px; height:880px; transform-origin: 50% 50%; }
  .phone { width:426px; height:880px; border-radius:62px; background:#05070C; padding:18px; box-shadow: 0 50px 120px -20px rgba(0,0,0,.8), inset 0 0 0 2px #2A3242, 0 0 0 1px rgba(255,255,255,.06); position:relative; }
  .phone::before { content:''; position:absolute; top:30px; left:50%; width:110px; height:30px; margin-left:-55px; background:#05070C; border-radius:20px; z-index:3; }
  .phone .screen { width:390px; height:844px; border-radius:46px; overflow:hidden; background:var(--paper); position:relative; }
  .mobile iframe { width:390px; height:844px; border:0; display:block; }

  /* ── Captions (desktop: lower band · mobile: left column) ── */
  #cap { position:absolute; transition: opacity .5s var(--ease), transform .5s var(--ease); }
  .desktop #cap { left:220px; right:220px; top:902px; min-height:96px; display:flex; gap:28px; align-items:flex-start; z-index:30; padding:16px 24px; border-radius:18px; background:rgba(8,16,29,.78); backdrop-filter: blur(6px); }
  #chap { flex:0 0 auto; font-size:15px; font-weight:700; letter-spacing:.02em; color:var(--orange); padding-top:8px; white-space:nowrap; }
  #chap .n { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:9px; background:rgba(252,124,36,.15); margin-right:10px; font-variant-numeric:tabular-nums; }
  #sub { font-size:27px; line-height:1.4; font-weight:500; color:#E9EEF6; max-width:1250px; }
  #sub span { transition: opacity .35s var(--ease); }
  .mobile #cap { left:150px; top:0; bottom:0; width:860px; display:flex; flex-direction:column; justify-content:center; }
  .mobile #chap { font-size:17px; margin-bottom:22px; }
  .mobile #title { font-size:62px; line-height:1.06; font-weight:800; letter-spacing:-.02em; margin:0 0 26px; }
  .mobile #sub { font-size:29px; color:#C9D3E3; max-width:760px; }
  #title:empty { display:none; }

  /* ── Cursor & touch ─────────────────────────── */
  #cursor { position:absolute; left:0; top:0; z-index:50; width:30px; height:30px; transition: transform .75s var(--ease), opacity .3s; pointer-events:none; filter: drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  .mobile #cursor { width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:rgba(255,255,255,.35); border:2px solid rgba(255,255,255,.9); box-shadow:0 6px 20px rgba(0,0,0,.35); }
  .ripple { position:absolute; z-index:49; width:70px; height:70px; margin:-35px 0 0 -35px; border-radius:50%; border:3px solid var(--orange); pointer-events:none; animation: rip .65s var(--ease) forwards; }
  @keyframes rip { from { transform:scale(.2); opacity:1 } to { transform:scale(1.4); opacity:0 } }

  /* ── Cards ───────────────────────────────────── */
  #card { position:absolute; inset:0; z-index:40; display:grid; place-items:center; pointer-events:none; }
  #card > .c { opacity:0; transform: translateY(24px); transition: opacity .8s var(--ease), transform .8s var(--ease); width:1560px; }
  #card.on > .c { opacity:1; transform:none; }
  .eyebrow { font-size:20px; font-weight:700; color:var(--orange); letter-spacing:.04em; margin-bottom:18px; }
  .h { font-size:76px; line-height:1.04; font-weight:800; letter-spacing:-.025em; margin:0; }
  .h em { font-style:normal; color:var(--orange); }
  .lead { font-size:30px; color:#B8C4D6; margin-top:22px; max-width:1100px; line-height:1.45; }
  .st > * { opacity:0; transform:translateY(22px); }
  #card.on .st > * { animation: up .8s var(--ease) forwards; }
  #card.on .st > *:nth-child(1){animation-delay:.25s} #card.on .st > *:nth-child(2){animation-delay:.55s} #card.on .st > *:nth-child(3){animation-delay:.85s}
  #card.on .st > *:nth-child(4){animation-delay:1.15s} #card.on .st > *:nth-child(5){animation-delay:1.45s} #card.on .st > *:nth-child(6){animation-delay:1.75s}
  @keyframes up { to { opacity:1; transform:none } }

  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:24px; margin-top:56px; }
  .tile { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); border-radius:24px; padding:34px; }
  .tile .k { width:56px; height:56px; border-radius:16px; display:grid; place-items:center; background:rgba(252,124,36,.14); color:var(--orange); font-size:26px; font-weight:800; margin-bottom:26px; }
  .tile h3 { font-size:30px; margin:0 0 10px; letter-spacing:-.01em; }
  .tile p { font-size:21px; color:#AEBBD0; margin:0; line-height:1.45; }

  .people { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; margin-top:48px; }
  .person { position:relative; height:520px; border-radius:26px; overflow:hidden; background:#1a2438; }
  .person img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.08); transition: transform 6s linear; }
  #card.on .person img { transform:scale(1); }
  .person::after { content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(9,14,25,.95), rgba(9,14,25,.35) 55%, transparent); }
  .person div { position:absolute; left:26px; right:26px; bottom:26px; z-index:1; }
  .person .r { color:var(--orange); font-size:17px; font-weight:700; }
  .person .n { font-size:32px; font-weight:800; margin:4px 0 10px; }
  .person .q { font-size:18px; color:#D7DEEA; line-height:1.45; }

  .principles { margin-top:46px; display:grid; gap:16px; }
  .pr { display:flex; align-items:center; gap:26px; font-size:44px; font-weight:700; letter-spacing:-.015em; }
  .pr b { width:64px; height:64px; border-radius:18px; background:var(--orange); color:var(--navy); display:grid; place-items:center; font-size:28px; }

  .sw { display:grid; grid-template-columns: 1.15fr 1fr 1fr; gap:22px; margin-top:44px; }
  .swatch { border-radius:26px; padding:34px; height:330px; display:flex; flex-direction:column; justify-content:flex-end; position:relative; overflow:hidden; }
  .swatch .hex { font-size:20px; font-weight:700; opacity:.85; letter-spacing:.04em; }
  .swatch h3 { font-size:40px; margin:6px 0 8px; }
  .swatch p { font-size:20px; margin:0; line-height:1.4; opacity:.92; }
  .ratio { margin-top:26px; display:flex; height:22px; border-radius:11px; overflow:hidden; }
  .badges { display:flex; gap:14px; margin-top:22px; }
  .badge { font-size:19px; font-weight:700; padding:10px 18px; border-radius:999px; background:rgba(29,175,143,.15); color:#6EE0C4; }

  .scripts { display:flex; flex-wrap:wrap; gap:18px 44px; margin-top:44px; font-size:72px; font-weight:700; color:#fff; }
  .scripts span:nth-child(3n+2){ color:var(--orange) } .scripts span:nth-child(3n){ color:#6EE0C4 }

  .center { text-align:center; display:flex; flex-direction:column; align-items:center; }
  .logoDraw path, .logoDraw circle { stroke-dasharray: 400; stroke-dashoffset: 400; }
  #card.on .logoDraw path, #card.on .logoDraw circle { animation: draw 1.8s var(--ease) forwards; }
  #card.on .logoDraw g[fill] path, #card.on .logoDraw g[fill] circle { animation: fillin .9s var(--ease) 1.1s forwards; }
  .logoDraw g[fill] path, .logoDraw g[fill] circle { opacity:0; stroke-dasharray:none; stroke-dashoffset:0; }
  @keyframes draw { to { stroke-dashoffset:0 } }
  @keyframes fillin { to { opacity:1 } }
  .word { font-size:110px; font-weight:800; letter-spacing:.02em; margin:24px 0 0; }
  .tag { font-size:34px; color:#B8C4D6; margin-top:12px; }
  .meta { margin-top:40px; font-size:20px; color:#7F8DA4; letter-spacing:.06em; font-weight:600; }
  .facts { display:flex; gap:22px; margin-top:42px; }
  .fact { padding:18px 30px; border-radius:999px; border:1px solid rgba(255,255,255,.14); font-size:26px; font-weight:700; }

  #flash { position:absolute; inset:0; background:var(--navy2); opacity:0; pointer-events:none; z-index:60; transition: opacity .45s var(--ease); }
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="rig"></div>
  <div id="cap"><div id="chap"></div><div><h1 id="title"></h1><div id="sub"></div></div></div>
  <div id="card"></div>
  <div id="cursor"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 2.5 20 11.2l-7 1.6-3.2 6.7z" fill="#111E33" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  <div id="flash"></div>
  <script type="module" src="./stage.js"></script>
</body>
</html>
